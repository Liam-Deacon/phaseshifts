name: Notebook Execution

on:
  pull_request:
    branches: ['master']
    paths:
      - docs/tutorials/**
      - docs/tutorials.rst
      - docs/conf.py
      - binder/**
      - requirements-doc.txt
  push:
    branches: ['master']
    paths:
      - docs/tutorials/**
      - docs/tutorials.rst
      - docs/conf.py
      - binder/**
      - requirements-doc.txt

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    env:
      PHASESHIFTS_COMPILE_MISSING: '0'
      PHASESHIFTS_SKIP_COMPILE_ON_IMPORT: '1'
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install notebook dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nbmake numpy>=1.22 matplotlib>=3.5 jupyter ipykernel ase

      - name: Execute tutorial notebooks
        run: |
          pytest --nbmake --nbmake-timeout=600 docs/tutorials/*.ipynb
